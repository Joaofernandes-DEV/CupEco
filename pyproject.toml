[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cupeco"
version = "0.1.0"
description = "Triagem: jogo 2D de ação contra chefões sobre reciclagem e resíduos"
readme = "README.md"
requires-python = ">=3.11"
# Código sob MIT; conteúdo (textos, arte e sons) sob CC BY 4.0.
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "LICENCA-CONTEUDO.md"]
authors = [{ name = "João Vitor Fernandes" }]
dependencies = ["pygame-ce>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Geradores de arte (D10, D27). Versão fixa: a mesma arte sai igual em qualquer máquina.
ferramentas = ["pillow==12.3.0"]

[project.gui-scripts]
cupeco = "cupeco.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Dados revisáveis do jogo (D26) vão junto no pacote.
"cupeco.conteudo" = ["*.toml", "chefes/*.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A raiz entra no caminho de importação para os testes alcançarem `ferramentas/`.
pythonpath = ["."]
filterwarnings = [
    # Aviso esperado do driver de vídeo "dummy" usado nos testes sem janela.
    "ignore:no fast renderer available",
]
